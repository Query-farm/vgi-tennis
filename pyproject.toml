[project]
name = "vgi-tennis"
version = "0.1.0"
description = "A read-only VGI worker exposing ATP and WTA tennis rankings, tournaments, and match results to Haybarn SQL"
readme = "README.md"
license = "MIT"
authors = [{ name = "Query Farm", email = "hello@query.farm" }]
keywords = ["vgi", "duckdb", "arrow", "tennis", "atp", "wta", "grand slam", "rankings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
]
requires-python = ">=3.13"
dependencies = [
    "vgi-python[http]>=0.50.0,<0.51",
    "httpx>=0.27,<1",
    "pyarrow>=18,<26",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6,<8",
    "ruff>=0.16,<0.17",
]

[project.urls]
Homepage = "https://query.farm"
Documentation = "https://github.com/Query-farm/vgi-tennis#readme"
Repository = "https://github.com/Query-farm/vgi-tennis"
Issues = "https://github.com/Query-farm/vgi-tennis/issues"

[project.scripts]
vgi-tennis = "vgi_tennis.worker:main"
vgi-tennis-http = "vgi_tennis.worker:main_http"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vgi_tennis"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.coverage",
    "/.mypy_cache",
    "/.pytest_cache",
    "/.ruff_cache",
    "/dist",
]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: hits the public WTA and ESPN tennis endpoints"]
