[project]
name = "vgi-tennis-notebooks"
version = "0.1.0"
description = "SQL stories about tennis scores, ranking populations and event-level quantities"
requires-python = ">=3.13,<3.15"
dependencies = ["vgi-example-notebooks[runner] @ git+https://github.com/Query-farm/vgi-example-notebooks@v0.3.55"]

[tool.ruff]
builtins = ["match_totals", "score_pairs", "round_counts", "checks", "scope", "agreement", "summary", "curve", "profile", "event_audit", "selection", "status_counts"]
line-length = 110
target-version = "py313"
extend-exclude = ["artifacts", "validation"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501", "E402"]
